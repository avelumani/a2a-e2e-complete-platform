kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30080   # Orchestrator A2A Agent (http://localhost:8000)
        hostPort: 8000
      - containerPort: 30443   # Argo CD UI (https://localhost:8443)
        hostPort: 8443
      - containerPort: 30444   # Kargo UI (http://localhost:8444)
        hostPort: 8444
      - containerPort: 30300   # Langfuse UI (http://localhost:3000)
        hostPort: 3000
