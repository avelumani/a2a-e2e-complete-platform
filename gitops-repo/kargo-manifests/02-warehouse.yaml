apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: order-agents-warehouse
  namespace: order-management
spec:
  subscriptions:
    - image:
        repoURL: ghcr.io/your-org/a2a-orchestrator-agent
        constraint: ^0.1.0
    - image:
        repoURL: ghcr.io/your-org/a2a-triage-agent
        constraint: ^0.1.0
    - image:
        repoURL: ghcr.io/your-org/a2a-allocation-agent
        constraint: ^0.1.0
    - image:
        repoURL: ghcr.io/your-org/a2a-credit-agent
        constraint: ^0.1.0
