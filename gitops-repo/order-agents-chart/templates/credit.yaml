{{- if .Values.credit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-agent
  labels:
    app: credit-agent
    app.kubernetes.io/part-of: a2a-order-management
spec:
  replicas: {{ .Values.credit.replicas }}
  selector:
    matchLabels:
      app: credit-agent
  template:
    metadata:
      labels:
        app: credit-agent
    spec:
      containers:
        - name: credit-agent
          image: "{{ .Values.credit.image.repository }}:{{ .Values.credit.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.credit.port }}
          env:
            - name: PORT
              value: {{ .Values.credit.port | quote }}
            - name: PUBLIC_URL
              value: "http://credit-agent:{{ .Values.credit.port }}"
          envFrom:
            - configMapRef:
                name: order-agents-config
            - secretRef:
                name: order-agents-secrets
          command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "{{ .Values.credit.port }}"]
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.credit.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: credit-agent
  labels:
    app: credit-agent
spec:
  type: ClusterIP
  selector:
    app: credit-agent
  ports:
    - name: http
      port: {{ .Values.credit.port }}
      targetPort: {{ .Values.credit.port }}
{{- end }}
