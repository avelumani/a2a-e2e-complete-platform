apiVersion: v1
kind: Secret
metadata:
  name: order-agents-secrets
  labels:
    app.kubernetes.io/part-of: a2a-order-management
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.global.openaiApiKey | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.langfuse.publicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.langfuse.secretKey | quote }}
